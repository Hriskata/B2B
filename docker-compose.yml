# Local test environment only. Ports are bound to 127.0.0.1 so nothing is
# reachable from the network. Secrets come from .env (not committed).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-b2b}
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
