name: CI

on:
  push:
    # main = the official site, develop = the test server (docs/ENVIRONMENTS.md)
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throw-away database for the integration tests only (CI-only password).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The test setup creates this database and applies the migrations.
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/b2b_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The server compose file must stay valid (dummy values, nothing is started).
      - run: docker compose -p ci -f docker-compose.server.yml config -q
        env:
          POSTGRES_PASSWORD: ci-only
          APP_URL: https://ci.invalid
          TOTP_ENCRYPTION_KEY: ci-only
          SMTP_HOST: smtp.invalid
          SMTP_PORT: "587"
          MAIL_FROM: ci@ci.invalid
          TURNSTILE_SITE_KEY: ci
          TURNSTILE_SECRET_KEY: ci
